name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check identities, dependencies and redistribution boundary
        run: python scripts/check-repository.py
      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1
